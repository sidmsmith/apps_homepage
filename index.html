<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Trigger deployment -->
  <title>SC Utilities v1.2.4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: rgb(45, 47, 59);
      --blue-select: #339af0;
      --border: #333;
      --card-bg: #484e5e;
      --input-bg: #282c34;
      --orange: #8a6d3b;
      --primary: #3B82F6;
      --purple: #9c27b0;
      --red-text: #ff6b6b;
      --secondary: #6c757d;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
      --success: hsl(142.1 76.2% 36.3%);
      --text: #495057;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem 0;
    }

    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      position: relative;
      overflow: visible;
    }

    .header {
      text-align: center;
      color: var(--text);
      margin-bottom: 3rem;
      position: relative;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 3.6rem;
    }

    .logo {
      position: absolute;
      /* Position at left edge of viewport - positioned relative to body */
      left: 1rem;
      height: 50px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.95;
      transition: opacity 0.2s;
      /* Align logo center with h1 center - calculate from top of body */
      /* Body has padding-top: 2rem, h1 is 3rem * 1.2 line-height = 3.6rem */
      /* Logo center should align with h1 center */
      top: calc(2rem + ((3.6rem - 3.125rem) / 2));
      z-index: 100;
    }
    
    body {
      position: relative;
    }

    .logo:hover {
      opacity: 1;
    }

    .header-text {
      text-align: center;
    }

    .header h1 {
      font-size: 3rem;
      line-height: 1.2;
      margin-top: 0;
      margin-bottom: 0.5rem;
      padding-top: 0;
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .logo {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        height: 40px;
        margin-bottom: 0.5rem;
      }
      
      .header-text {
        width: 100%;
      }
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }

    .header p {
      font-size: 1.2rem;
      color: #bbbbbb;
    }

    .stats-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.9rem;
      color: #bbbbbb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .apps-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .apps-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .app-item {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 0;
      transition: background-color 0.2s;
    }

    .app-item:last-child {
      border-bottom: none;
    }

    .app-item:hover {
      background-color: var(--input-bg);
      margin: 0 -1rem;
      padding-left: 1rem;
      padding-right: 1rem;
      border-radius: 8px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .app-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .app-name:hover {
      text-decoration: underline;
      color: var(--blue-select);
    }

    .app-name i {
      font-size: 1.2rem;
    }

    .app-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: #bbbbbb;
    }

    .app-meta-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .app-description {
      color: #bbbbbb;
      margin-top: 0.5rem;
      line-height: 1.6;
    }

    .version-badge {
      background: var(--primary);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #bbbbbb;
    }

    .error {
      background: #2d1f1f;
      border: 1px solid var(--red-text);
      color: var(--red-text);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .app-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .app-meta {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <img src="/manhlogo.png" alt="Manhattan Associates" class="logo" onerror="this.style.display='none'">
  <div class="main-container">
    <div class="header">
      <div class="header-content">
        <div class="header-text">
          <h1>SC Utilities</h1>
          <p>Your collection of Manhattan Associates tools and utilities</p>
        </div>
      </div>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <div class="stat-value" id="totalApps">-</div>
        <div class="stat-label">Total Apps</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalVisits">-</div>
        <div class="stat-label">Total Visits</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="lastVisit">-</div>
        <div class="stat-label">Last Visit</div>
      </div>
    </div>

    <div class="apps-container">
      <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i> Loading applications...
      </div>
      <div id="error" class="error" style="display: none;"></div>
      <ul class="apps-list" id="appsList" style="display: none;"></ul>
    </div>
  </div>

  <script>
    // ===== GENERIC METADATA COLLECTION (Reusable across all apps) =====
    function getCommonMetadata(additionalMetadata = {}) {
      const now = Date.now();
      const pageLoadTime = window._pageLoadTime || now;
      const timeOnPage = Math.floor((now - pageLoadTime) / 1000);
      
      // Parse user agent
      const ua = navigator.userAgent;
      const browserInfo = parseUserAgent(ua);
      
      // Get screen info
      const screenWidth = window.screen.width;
      const screenHeight = window.screen.height;
      const screenResolution = `${screenWidth}x${screenHeight}`;
      
      // Get URL parameters
      const urlParamsObj = {};
      const currentUrlParams = new URLSearchParams(window.location.search);
      for (const [key, value] of currentUrlParams.entries()) {
        urlParamsObj[key] = value;
      }
      
      // Build common metadata
      const commonMetadata = {
        // User/Browser Information
        user_agent: ua,
        browser_name: browserInfo.name,
        browser_version: browserInfo.version,
        device_type: getDeviceType(),
        os_name: browserInfo.os,
        os_version: browserInfo.osVersion,
        screen_resolution: screenResolution,
        screen_width: screenWidth,
        screen_height: screenHeight,
        
        // Session Information
        session_id: getSessionId(),
        time_on_page_seconds: timeOnPage,
        page_url: window.location.href,
        page_path: window.location.pathname,
        
        // URL Parameters
        url_params: urlParamsObj,
        has_url_params: Object.keys(urlParamsObj).length > 0,
        
        // App State
        referrer: document.referrer || null,
        timestamp: new Date().toISOString()
      };
      
      return { ...commonMetadata, ...additionalMetadata };
    }
    
    function parseUserAgent(ua) {
      let name = 'Unknown';
      let version = 'Unknown';
      let os = 'Unknown';
      let osVersion = 'Unknown';
      
      // Browser detection
      if (ua.includes('Chrome') && !ua.includes('Edg')) {
        const match = ua.match(/Chrome\/([\d.]+)/);
        if (match) { name = 'Chrome'; version = match[1]; }
      } else if (ua.includes('Firefox')) {
        const match = ua.match(/Firefox\/([\d.]+)/);
        if (match) { name = 'Firefox'; version = match[1]; }
      } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
        const match = ua.match(/Version\/([\d.]+)/);
        if (match) { name = 'Safari'; version = match[1]; }
      } else if (ua.includes('Edg')) {
        const match = ua.match(/Edg\/([\d.]+)/);
        if (match) { name = 'Edge'; version = match[1]; }
      }
      
      // OS detection
      if (ua.includes('Windows NT')) {
        const match = ua.match(/Windows NT ([\d.]+)/);
        os = 'Windows';
        if (match) {
          const ntVersion = match[1];
          const versionMap = { '10.0': '10/11', '6.3': '8.1', '6.2': '8', '6.1': '7' };
          osVersion = versionMap[ntVersion] || ntVersion;
        }
      } else if (ua.includes('Mac OS X')) {
        const match = ua.match(/Mac OS X ([\d_]+)/);
        os = 'macOS';
        if (match) osVersion = match[1].replace(/_/g, '.');
      } else if (ua.includes('Android')) {
        const match = ua.match(/Android ([\d.]+)/);
        os = 'Android';
        if (match) osVersion = match[1];
      } else if (ua.includes('iPhone') || ua.includes('iPad')) {
        const match = ua.match(/OS ([\d_]+)/);
        os = 'iOS';
        if (match) osVersion = match[1].replace(/_/g, '.');
      }
      
      return { name, version, os, osVersion };
    }
    
    function getDeviceType() {
      const ua = navigator.userAgent;
      if (/tablet|ipad|playbook|silk/i.test(ua)) return 'tablet';
      if (/mobile|iphone|ipod|android|blackberry|opera|mini|windows\sce|palm|smartphone|iemobile/i.test(ua)) return 'mobile';
      return 'desktop';
    }
    
    function getSessionId() {
      if (!window._sessionId) {
        window._sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
      }
      return window._sessionId;
    }
    
    // Usage tracking (dashboard ingest → Neon)
    async function trackEvent(eventName, metadata = {}) {
      try {
        await fetch('/api/usage-track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            event_name: eventName,
            metadata: getCommonMetadata(metadata)
          })
        });
      } catch (error) {
        // Silently fail - don't interrupt user experience
      }
    }
    
    // Initialize page load time
    window._pageLoadTime = Date.now();
    
    // URL Parameters for cross-app integration
    const urlParams = new URLSearchParams(window.location.search);
    const locationParam = urlParams.get('Location');
    const organizationParam = urlParams.get('Organization');
    const businessUnitParam = urlParams.get('BusinessUnit');
    
    // Store URL parameters for passing to apps
    const appUrlParams = {};
    if (locationParam) appUrlParams.Location = locationParam;
    if (organizationParam) appUrlParams.Organization = organizationParam;
    if (businessUnitParam) appUrlParams.BusinessUnit = businessUnitParam;
    
    // Helper function to append URL parameters to app URLs
    function buildAppUrl(baseUrl) {
      if (Object.keys(appUrlParams).length === 0) {
        return baseUrl;
      }
      
      const url = new URL(baseUrl);
      Object.entries(appUrlParams).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });
      return url.toString();
    }

    // Track visits
    function updateStats() {
      const visits = parseInt(localStorage.getItem('homepageVisits') || '0') + 1;
      localStorage.setItem('homepageVisits', visits.toString());
      localStorage.setItem('homepageLastVisit', new Date().toISOString());

      document.getElementById('totalVisits').textContent = visits;
      const lastVisit = localStorage.getItem('homepageLastVisit');
      if (lastVisit) {
        const date = new Date(lastVisit);
        document.getElementById('lastVisit').textContent = date.toLocaleDateString();
      }
    }

    // Load apps
    async function loadApps() {
      try {
        const response = await fetch('/api/apps');
        if (!response.ok) throw new Error('Failed to load apps');
        
        const apps = await response.json();
        
        // Hide loading, show list
        document.getElementById('loading').style.display = 'none';
        document.getElementById('appsList').style.display = 'block';

        // Separate apps into production and under development
        const productionApps = apps.filter(app => !app.under_development);
        const devApps = apps.filter(app => app.under_development);

        // Sort alphabetically (only for production apps)
        productionApps.sort((a, b) => a.name.localeCompare(b.name));
        // Under Development apps maintain API order (no sorting)

        // Update stats - only count production apps
        document.getElementById('totalApps').textContent = productionApps.length;
        updateStats();

        // Render apps
        const appsList = document.getElementById('appsList');
        let html = '';

        // Production apps
        if (productionApps.length > 0) {
          html += productionApps.map(app => {
            const appUrl = buildAppUrl(app.url);
            return `
            <li class="app-item">
              <div class="app-header">
                <a href="${appUrl}" target="_blank" class="app-name">
                  <i class="fas fa-external-link-alt"></i>
                  ${app.name}
                </a>
                <div class="app-meta">
                  ${app.version ? `<span class="app-meta-item"><i class="fas fa-tag"></i> <span class="version-badge">${app.version}</span></span>` : ''}
                  ${app.lastUpdated ? `<span class="app-meta-item"><i class="fas fa-clock"></i> ${app.lastUpdated}</span>` : ''}
                </div>
              </div>
              ${app.description ? `<div class="app-description">${app.description}</div>` : ''}
            </li>
          `;
          }).join('');
        }

        // Under Development section
        if (devApps.length > 0) {
          html += `<li class="app-item" style="border-top: 2px solid var(--primary); margin-top: 1rem; padding-top: 2rem;">
            <div style="font-size: 1.2rem; font-weight: 600; color: var(--primary); margin-bottom: 1rem;">
              <i class="fas fa-tools"></i> Under Development
            </div>
          </li>`;
          html += devApps.map(app => {
            const appUrl = buildAppUrl(app.url);
            return `
            <li class="app-item">
              <div class="app-header">
                <a href="${appUrl}" target="_blank" class="app-name">
                  <i class="fas fa-external-link-alt"></i>
                  ${app.name}
                </a>
                <div class="app-meta">
                  ${app.version ? `<span class="app-meta-item"><i class="fas fa-tag"></i> <span class="version-badge">${app.version}</span></span>` : ''}
                  ${app.lastUpdated ? `<span class="app-meta-item"><i class="fas fa-clock"></i> ${app.lastUpdated}</span>` : ''}
                </div>
              </div>
              ${app.description ? `<div class="app-description">${app.description}</div>` : ''}
            </li>
          `;
          }).join('');
        }

        appsList.innerHTML = html;
        
        // Track app clicks after apps are rendered
        setTimeout(() => {
          const appLinks = document.querySelectorAll('.app-name');
          appLinks.forEach(link => {
            link.addEventListener('click', function(e) {
              const appName = this.textContent.trim().replace(/^\s*[^\s]+\s*/, ''); // Remove icon text
              const appUrl = this.getAttribute('href');
              
              trackEvent('app_clicked', {
                app_name: appName,
                app_url: appUrl
              });
            });
          });
        }, 100);
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = `Error loading apps: ${error.message}`;
      }
    }

    // Load on page load
    window.addEventListener('load', async () => {
      // Track app opened
      await trackEvent('app_opened', {});
      loadApps();
    });
  </script>
  <!-- Vercel Analytics -->
  <script>
    (function() {
      const script = document.createElement('script');
      script.src = '/_vercel/insights/script.js';
      script.defer = true;
      script.onerror = function() {
        console.warn('Vercel Analytics script failed to load. Make sure Analytics is enabled in Vercel dashboard and the app is redeployed.');
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
